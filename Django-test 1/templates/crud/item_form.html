<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% if object %}Изменить запись{% else %}Новая запись{% endif %}</title>
</head>
<body>
    <main>
        <h1>{% if object %}Изменить запись{% else %}Новая запись{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить</button>
        </form>
        <p><a href="{% url 'crud:item_list' %}">Отмена</a></p>
    </main>
</body>
</html>
