<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Тропы — активные туры{% endblock %}</title>
    <style>
        :root { color-scheme: light; --forest: #183c32; --leaf: #39705b; --paper: #f5f3e9; --ink: #17241f; --clay: #d06b45; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 Georgia, "Times New Roman", serif; }
        a { color: inherit; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px max(24px, calc((100% - 1080px) / 2)); background: var(--forest); color: white; font-family: "Trebuchet MS", sans-serif; }
        .brand { color: white; font-size: 22px; font-weight: bold; text-decoration: none; }
        .nav { display: flex; align-items: center; gap: 18px; }
        .nav a, .nav button { color: white; font: inherit; }
        .nav button { border: 0; background: transparent; cursor: pointer; }
        main { width: min(100% - 40px, 1000px); margin: 44px auto 80px; }
        h1, h2 { color: var(--forest); line-height: 1.15; }
        h1 { max-width: 760px; font-size: clamp(36px, 7vw, 64px); margin: 0 0 18px; }
        .intro { max-width: 680px; font-size: 19px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 18px; margin-top: 32px; }
        .tour { padding: 22px; border: 1px solid #c8d0c5; background: #fffef9; }
        .tour h2 { margin-top: 0; font-size: 25px; }
        .tag { display: inline-block; margin: 0 6px 6px 0; padding: 3px 9px; background: #dce8df; color: var(--forest); font: 13px "Trebuchet MS", sans-serif; }
        .button { display: inline-block; padding: 10px 16px; border: 0; background: var(--clay); color: white; text-decoration: none; font: bold 15px "Trebuchet MS", sans-serif; cursor: pointer; }
        .form { max-width: 560px; padding: 24px; background: #fffef9; border: 1px solid #c8d0c5; }
        .form p { margin: 0 0 16px; }
        .form label { display: block; margin-bottom: 4px; font-weight: bold; }
        .form input, .form select, .form textarea { width: 100%; padding: 10px; border: 1px solid #8a9b8e; background: white; font: inherit; }
        .helptext, .form ul { color: #53665b; font-size: 14px; }
        .messages { padding: 12px; background: #dce8df; }
        .review { margin: 18px 0; padding-top: 14px; border-top: 1px solid #c8d0c5; }
        @media (max-width: 600px) { .topbar { align-items: flex-start; flex-direction: column; } .nav { flex-wrap: wrap; gap: 12px; } main { margin-top: 30px; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'tours:tour_list' %}">Тропы / Кыргызстан</a>
        <nav class="nav">
            {% if user.is_authenticated %}
                <a href="{% url 'tours:review_create' %}">Оставить отзыв</a>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'tours:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<p class="messages">{{ message }}</p>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
